                                        </div>
                                        <div className="space-y-1">
                                            <label className="font-semibold block">Retirada</label>
                                            <input 
                                                type="time" 
                                                required
                                                value={newBooking.withdrawalTime} 
                                                onChange={(e) => setNewBooking(prev => ({ ...prev, withdrawalTime: e.target.value }))}
                                                className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                            />
                                        </div>
                                    </div>

                                    {/* Escolher Brinquedos */}
                                    <div className="space-y-2">
                                        <label className="font-semibold block">Brinquedos Solicitados</label>
                                        <div className="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-800 rounded-xl">
                                            {toys.map(toy => (
                                                <label key={toy.id} className="flex items-center gap-2 p-1.5 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
                                                    <input 
                                                        type="checkbox" 
                                                        value={toy.id}
                                                        checked={newBooking.selectedToys.includes(String(toy.id))}
                                                        onChange={(e) => {
                                                            const val = e.target.value;
                                                            setNewBooking(prev => {
                                                                const checked = prev.selectedToys.includes(val)
                                                                    ? prev.selectedToys.filter(id => id !== val)
                                                                    : [...prev.selectedToys, val];
                                                                return { ...prev, selectedToys: checked };
                                                            });
                                                        }}
                                                        className="accent-brand-pink-500"
                                                    />
                                                    <span className="text-xs">{toy.name} ({formatBRL(toy.rentalValue)})</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ALERTA INTELIGENTE DE CONFLITO IA */}
                                    {bookingConflict && (
                                        <div className="p-4 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900 rounded-2xl space-y-2">
                                            <p className="text-xs font-bold text-red-600 dark:text-red-400">
                                                <i className="fa-solid fa-triangle-exclamation"></i> Conflito de Agenda Detectado!
                                            </p>
                                            <p className="text-xs text-red-500">{bookingConflict}</p>
                                            
                                            {/* Sugestões de brinquedos livres (IA) */}
                                            {aiSuggestions.length > 0 && (
                                                <div className="mt-2 pt-2 border-t border-red-100 dark:border-red-900/50">
                                                    <p className="text-xs font-bold text-brand-blue-600">💡 Alternativas Disponíveis neste período:</p>
                                                    <div className="flex flex-wrap gap-2 mt-1">
                                                        {aiSuggestions.map(altToy => (
                                                            <button
                                                                type="button"
                                                                key={altToy.id}
                                                                onClick={() => {
                                                                    setNewBooking(prev => ({
                                                                        ...prev,
                                                                        selectedToys: [...prev.selectedToys.filter(id => toys.find(t => t.id === Number(id))?.status !== 'MAINTENANCE'), String(altToy.id)]
                                                                    }));
                                                                    setBookingConflict(null);
                                                                }}
                                                                className="px-2 py-1 bg-brand-pink-500 hover:bg-brand-pink-600 text-white rounded-lg text-[10px] font-bold"
                                                            >
                                                                Substituir por: {altToy.name} ({formatBRL(altToy.rentalValue)})
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Resumos Financeiros Calculados Dinamicamente (Integrando Frete) */}
                                    <div className="p-4 bg-gradient-to-r from-brand-blue-50 to-brand-pink-50 dark:from-slate-800 dark:to-slate-700 rounded-2xl grid grid-cols-2 gap-4 text-xs">
                                        <div>
                                            <span className="text-slate-400 block font-bold">Valor dos Brinquedos</span>
                                            <span className="font-bold text-sm text-slate-700 dark:text-white">{formatBRL(bookingCalculatedValues.toysSum)}</span>
                                        </div>
                                        <div>
                                            <span className="text-slate-400 block font-bold">Valor do Frete (R$)</span>
                                            <input 
                                                type="number" 
                                                placeholder="R$ 0,00"
                                                value={newBooking.shippingValue}
                                                onChange={(e) => setNewBooking(prev => ({ ...prev, shippingValue: e.target.value }))}
                                                className="w-full bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-pink-100 dark:border-slate-700 outline-none text-xs"
                                            />
                                        </div>
                                        <div>
                                            <span className="text-slate-400 block font-bold">Sinal da Reserva (R$)</span>
                                            <input 
                                                type="number" 
                                                placeholder="Insira o sinal..."
                                                value={newBooking.depositValue}
                                                onChange={(e) => setNewBooking(prev => ({ ...prev, depositValue: e.target.value }))}
                                                className="w-full bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-pink-100 dark:border-slate-700 outline-none text-xs"
                                            />
                                        </div>
                                        <div>
                                            <span className="text-slate-400 block font-bold">Valor Total (c/ Frete)</span>
                                            <span className="font-black text-sm text-brand-blue-800 dark:text-white">{formatBRL(bookingCalculatedValues.total)}</span>
                                        </div>
                                        <div>
                                            <span className="text-slate-400 block font-bold">Restante a Pagar</span>
                                            <span className="font-black text-brand-pink-500 text-sm">{formatBRL(bookingCalculatedValues.remaining)}</span>
                                        </div>
                                        <div>
                                            <span className="text-slate-400 block font-bold">Porcentagem Paga</span>
                                            <span className="font-bold text-green-600 text-sm">{bookingCalculatedValues.percentPaid}%</span>
                                        </div>
                                    </div>

                                    {/* Observações */}
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Observações do Evento</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="Ex: Ponto de referência, local gramado, tomada próxima..."
                                            value={newBooking.notes}
                                            onChange={(e) => setNewBooking(prev => ({ ...prev, notes: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        ></textarea>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={!!bookingConflict || newBooking.selectedToys.length === 0 || !newBooking.clientName.trim()}
                                        className="w-full py-3 bg-gradient-to-r from-brand-blue-400 to-brand-pink-400 text-white rounded-xl font-bold text-sm shadow-md transition-all disabled:opacity-50"
                                    >
                                        {editingBookingId ? 'Salvar Alterações' : 'Confirmar e Salvar Reserva'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL: NOVO CLIENTE --- */}
                    {showClientModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-brand-darkCard p-8 rounded-3xl max-w-md w-full shadow-2xl border border-pink-100 dark:border-slate-800">
                                <div className="flex justify-between items-center border-b border-pink-100 dark:border-slate-800 pb-4 mb-6">
                                    <h3 className="brand-title text-lg font-bold text-brand-pink-600">Novo Cliente</h3>
                                    <button onClick={() => setShowClientModal(false)} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-brand-blue-500"><i className="fa-solid fa-times text-lg"></i></button>
                                </div>

                                <form onSubmit={handleAddClient} className="space-y-4 text-sm">
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Nome Completo</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="Ex: João da Silva"
                                            value={newClient.fullName}
                                            onChange={(e) => setNewClient(prev => ({ ...prev, fullName: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Telefone (WhatsApp)</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="Ex: 11999998888"
                                            value={newClient.phone}
                                            onChange={(e) => setNewClient(prev => ({ ...prev, phone: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Observações do Cliente</label>
                                        <textarea 
                                            rows="3"
                                            placeholder="Ex: Apartamento, exige cadastro prévio..."
                                            value={newClient.notes}
                                            onChange={(e) => setNewClient(prev => ({ ...prev, notes: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        ></textarea>
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-brand-blue-400 to-brand-pink-400 text-white rounded-xl font-bold transition-all shadow-md">Salvar Cliente</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL: REGISTRAR PAGAMENTO --- */}
                    {showPaymentModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-brand-darkCard p-8 rounded-3xl max-w-md w-full shadow-2xl border border-pink-100 dark:border-slate-800">
                                <div className="flex justify-between items-center border-b border-pink-100 dark:border-slate-800 pb-4 mb-6">
                                    <h3 className="brand-title text-lg font-bold text-brand-blue-600">Registrar Entrada / Pagamento</h3>
                                    <button onClick={() => setShowPaymentModal(false)} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-brand-pink-500"><i className="fa-solid fa-times text-lg"></i></button>
                                </div>

                                <form onSubmit={handleAddPayment} className="space-y-4 text-sm">
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Reserva Contratante</label>
                                        <select 
                                            required
                                            value={newPayment.bookingId} 
                                            onChange={(e) => {
                                                const selectedBooking = bookings.find(b => b.id === Number(e.target.value));
                                                setNewPayment(prev => ({ 
                                                    ...prev, 
                                                    bookingId: e.target.value,
                                                    amountReceived: selectedBooking ? selectedBooking.remainingValue : ''
                                                }));
                                            }}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        >
                                            <option value="">Selecione a reserva pendente...</option>
                                            {bookings.filter(b => b.status !== 'PAID' && b.status !== 'CANCELLED').map(b => {
                                                const c = clients.find(cl => cl.id === b.clientId);
                                                return <option key={b.id} value={b.id}>{c?.fullName} — Evento: {b.eventDate} (Pendente: {formatBRL(b.remainingValue)})</option>
                                            })}
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Valor Recebido</label>
                                        <input 
                                            type="number" 
                                            required
                                            placeholder="Ex: 100.00"
                                            value={newPayment.amountReceived}
                                            onChange={(e) => setNewPayment(prev => ({ ...prev, amountReceived: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Data do Recebimento</label>
                                        <input 
                                            type="date" 
                                            required
                                            value={newPayment.receivedDate}
                                            onChange={(e) => setNewPayment(prev => ({ ...prev, receivedDate: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        />
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-brand-blue-400 to-brand-pink-400 text-white rounded-xl font-bold transition-all shadow-md">Registrar Recebimento</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL: NOVO BRINQUEDO --- */}
                    {showToyModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white dark:bg-brand-darkCard p-8 rounded-3xl max-w-md w-full shadow-2xl border border-pink-100 dark:border-slate-800">
                                <div className="flex justify-between items-center border-b border-pink-100 dark:border-slate-800 pb-4 mb-6">
                                    <h3 className="brand-title text-lg font-bold text-brand-pink-600">Novo Brinquedo</h3>
                                    <button onClick={() => setShowToyModal(false)} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-brand-blue-500"><i className="fa-solid fa-times text-lg"></i></button>
                                </div>

                                <form onSubmit={handleAddToy} className="space-y-4 text-sm">
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Nome do Brinquedo</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="Ex: Cama Elástica Gigante"
                                            value={newToy.name}
                                            onChange={(e) => setNewToy(prev => ({ ...prev, name: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Valor Base do Aluguel</label>
                                        <input 
                                            type="number" 
                                            required
                                            placeholder="Ex: 120.00"
                                            value={newToy.rentalValue}
                                            onChange={(e) => setNewToy(prev => ({ ...prev, rentalValue: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="font-semibold block">Status Inicial</label>
                                        <select 
                                            value={newToy.status}
                                            onChange={(e) => setNewToy(prev => ({ ...prev, status: e.target.value }))}
                                            className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-pink-100 dark:border-slate-700"
                                        >
                                            <option value="AVAILABLE">Disponível</option>
                                            <option value="MAINTENANCE">Em Manutenção</option>
                                        </select>
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-brand-blue-400 to-brand-pink-400 text-white rounded-xl font-bold transition-all shadow-md">Salvar Brinquedo</button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Renderização principal do app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuKids - Gestão de Aluguel de Brinquedos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: {
                                50: '#f0f9ff',
                                100: '#e0f2fe',
                                200: '#bae6fd', // Baby Blue Light
                                300: '#7dd3fc',
                                400: '#38bdf8',

                                600: '#0284c7',

                            },
                            pink: {

                                300: '#f472b6', // Baby Pink Main
                                400: '#e11d48',
                                500: '#ec4899',
                                600: '#db2777',
                                700: '#be185d'
                            },
                            darkBg: '#0f172a',
                            darkCard: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .brand-title {
            font-family: 'Comfortaa', cursive;
        }
        /* Custom scrollbar para o painel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-brand-darkBg dark:text-slate-100 transition-colors duration-200">
    <div style="position:fixed;bottom:12px;right:12px;z-index:9999;background:#0f172a;color:#fff;padding:8px 12px;border-radius:10px;font:12px Arial;opacity:.9">Versão demonstrativa • dados fictícios</div>

    <div id="root"></div>

    <!-- React e Babel production CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- App Logic & UI -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const INITIAL_TOYS = [
            { id: 1, name: "Pula pula", rentalValue: 100.00, status: "AVAILABLE" },
            { id: 2, name: "Espaço Baby", rentalValue: 150.00, status: "AVAILABLE" },
            { id: 3, name: "Pegue e monte", rentalValue: 90.00, status: "AVAILABLE" }
        ];

        // Base de dados restaurada a partir das reservas já cadastradas pela usuária
        const INITIAL_CLIENTS = [
            { id: 9001, fullName: "Ana Souza", phone: "61999990001", notes: "Cliente fictício para demonstração" },
            { id: 9002, fullName: "Bruno Lima", phone: "61999990002", notes: "Cliente fictício para demonstração" },
            { id: 9003, fullName: "Carla Mendes", phone: "61999990003", notes: "Cliente fictício para demonstração" },
            { id: 9004, fullName: "Diego Alves", phone: "61999990004", notes: "Cliente fictício para demonstração" },
            { id: 9005, fullName: "Fernanda Rocha", phone: "61999990005", notes: "Cliente fictício para demonstração" }
        ];
        const INITIAL_BOOKINGS = [
            { id: 9101, clientId: 9001, eventDate: "2026-09-06", deliveryTime: "08:00", withdrawalTime: "18:00", toyIds: [2], shippingValue: 40.00, totalValue: 190.00, depositValue: 60.00, remainingValue: 130.00, depositPaymentDate: "2026-09-02", status: "DEPOSIT_PAID", notes: "Reserva demonstrativa" },
            { id: 9102, clientId: 9002, eventDate: "2026-09-12", deliveryTime: "09:00", withdrawalTime: "19:00", toyIds: [1, 3], shippingValue: 30.00, totalValue: 220.00, depositValue: 100.00, remainingValue: 120.00, depositPaymentDate: "2026-09-02", status: "DEPOSIT_PAID", notes: "Reserva demonstrativa" },
            { id: 9103, clientId: 9003, eventDate: "2026-09-19", deliveryTime: "10:00", withdrawalTime: "20:00", toyIds: [1], shippingValue: 50.00, totalValue: 150.00, depositValue: 150.00, remainingValue: 0.00, depositPaymentDate: "2026-09-02", status: "PAID", notes: "Reserva demonstrativa" },
            { id: 9104, clientId: 9004, eventDate: "2026-09-20", deliveryTime: "08:00", withdrawalTime: "18:00", toyIds: [3], shippingValue: 0.00, totalValue: 90.00, depositValue: 0.00, remainingValue: 90.00, depositPaymentDate: null, status: "WAITING_DEPOSIT", notes: "Reserva demonstrativa" },
            { id: 9105, clientId: 9005, eventDate: "2026-09-26", deliveryTime: "08:00", withdrawalTime: "18:00", toyIds: [2, 3], shippingValue: 60.00, totalValue: 300.00, depositValue: 120.00, remainingValue: 180.00, depositPaymentDate: "2026-09-02", status: "DEPOSIT_PAID", notes: "Reserva demonstrativa" }
        ];
        const INITIAL_FINANCES = [
            { id: 9201, clientId: 9001, bookingId: 9101, receivedDate: "2026-09-02", amountReceived: 60.00 },
            { id: 9202, clientId: 9002, bookingId: 9102, receivedDate: "2026-09-02", amountReceived: 100.00 },
            { id: 9203, clientId: 9003, bookingId: 9103, receivedDate: "2026-09-02", amountReceived: 150.00 },
            { id: 9204, clientId: 9005, bookingId: 9105, receivedDate: "2026-09-02", amountReceived: 120.00 }
        ];

        // Garante que as reservas restauradas apareçam sempre que o app for aberto,
        // mesmo em um navegador/arquivo "zerado" sem dados salvos ainda.
        (function seedRestoredData() {
            const SEED_VERSION = 'seed_demo_publico_2026_09_02';
            if (localStorage.getItem('jukids_seed_version') !== SEED_VERSION) {
                localStorage.setItem('jukids_toys_v6', JSON.stringify(INITIAL_TOYS));
                localStorage.setItem('jukids_clients_v6', JSON.stringify(INITIAL_CLIENTS));
                localStorage.setItem('jukids_bookings_v6', JSON.stringify(INITIAL_BOOKINGS));
                localStorage.setItem('jukids_finances_v6', JSON.stringify(INITIAL_FINANCES));
                localStorage.setItem('jukids_seed_version', SEED_VERSION);
            }
        })();

        // Definindo datas relativas dinâmicas
        const getRelativeDate = (offsetDays) => {
            const date = new Date();
            date.setDate(date.getDate() + offsetDays);
            return date.toISOString().split('T')[0];
        };

        function App() {
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
            const [userRole, setUserRole] = useState('admin'); // 'admin' ou 'employee'
            const [searchQuery, setSearchQuery] = useState('');

            const [toys, setToys] = useState(() => {
                const stored = localStorage.getItem('jukids_toys_v6');
                return stored ? JSON.parse(stored) : INITIAL_TOYS;
            });
            const [clients, setClients] = useState(() => {
                const stored = localStorage.getItem('jukids_clients_v6');
                return stored ? JSON.parse(stored) : INITIAL_CLIENTS;
            });
            const [bookings, setBookings] = useState(() => {
                const stored = localStorage.getItem('jukids_bookings_v6');
                return stored ? JSON.parse(stored) : INITIAL_BOOKINGS;
            });
            const [finances, setFinances] = useState(() => {
                const stored = localStorage.getItem('jukids_finances_v6');
                return stored ? JSON.parse(stored) : INITIAL_FINANCES;
            });
            const [bookingLogs, setBookingLogs] = useState(() => {
                const stored = localStorage.getItem('jukids_logs_v6');
                return stored ? JSON.parse(stored) : [];
            });

            // Filtros Globais de Tempo
            const [timeFilter, setTimeFilter] = useState('month'); // day, week, month, year, all

            // Controle de Modais
            const [showBookingModal, setShowBookingModal] = useState(false);
            const [showClientModal, setShowClientModal] = useState(false);
            const [showToyModal, setShowToyModal] = useState(false);
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null); // Para o calendário

            // Sistema de Notificações Internas (Substitutos de alert() e confirm())
            const [notification, setNotification] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            // Estados de criação de novos objetos
            const [newClient, setNewClient] = useState({ fullName: '', phone: '', notes: '' });
            const [newToy, setNewToy] = useState({ name: '', rentalValue: '', status: 'AVAILABLE' });
            const [newPayment, setNewPayment] = useState({ clientId: '', bookingId: '', amountReceived: '', receivedDate: getRelativeDate(0) });
            const [newBooking, setNewBooking] = useState({
                clientName: '',
                clientPhone: '',
                eventDate: getRelativeDate(0),
                deliveryTime: '08:00',
                withdrawalTime: '18:00',
                selectedToys: [],
                shippingValue: '', 
                depositValue: '',
                notes: ''
            });

            // Estado de Edição de Reserva (null = criando nova, id = editando existente)
            const [editingBookingId, setEditingBookingId] = useState(null);

            // Estado de Conflito de Agenda (IA)
            const [bookingConflict, setBookingConflict] = useState(null);
            const [aiSuggestions, setAiSuggestions] = useState([]);

            const triggerToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => {
                    setNotification(null);
                }, 4000);
            };

            const triggerConfirm = (title, message, onConfirm) => {
                setConfirmDialog({ title, message, onConfirm });
            };

            const cleanPhoneForWhatsApp = (phone) => {
                if (!phone) return '';
                let cleaned = phone.replace(/\D/g, ''); // Remove tudo que não for número
                if (cleaned.length === 10 || cleaned.length === 11) {
                    cleaned = '55' + cleaned; // Adiciona código do Brasil se não tiver
                }
                return cleaned;
            };

            const handleWhatsAppSend = (phone, text) => {
                if (!phone || phone.trim() === '' || phone === 'Não Informado') {
                    triggerToast("Telefone inválido ou não cadastrado!", "error");
                    return;
                }
                const cleaned = cleanPhoneForWhatsApp(phone);
                const url = `https://api.whatsapp.com/send?phone=${cleaned}&text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            };

            // DEFINIÇÃO DA MENSAGEM DO WHATSAPP CONFORME SOLICITADO PELO USUÁRIO (ACOLHEDORA E COM EMOJIS DE PALMAS/FESTA)
            const generateConfirmationMessage = (booking) => {
                const client = clients.find(c => c.id === booking.clientId);
                const toyNames = booking.toyIds.map(id => toys.find(t => t.id === id)?.name).join(', ');
                const formattedDate = new Date(booking.eventDate + 'T00:00:00').toLocaleDateString('pt-BR');
                const shippingStr = Number(booking.shippingValue || 0) > 0 ? `🚚 *Frete:* ${formatBRL(booking.shippingValue)}\n` : '';
                
                return `🎉 Seja muito bem-vindo(a) à família Ju Kids, ${client?.fullName?.split(' ')[0] || ''}! 🎈\n\nQue alegria ter você com a gente! Sua reserva já está confirmadinha no nosso sistema. 💕\n\n📅 *Data:* ${formattedDate}\n⏰ *Horário:* ${booking.deliveryTime} às ${booking.withdrawalTime}\n🧸 *Brinquedos:* ${toyNames}\n${shippingStr}💰 *Total:* ${formatBRL(booking.totalValue)} · 💵 *Sinal:* ${formatBRL(booking.depositValue)} · ⚠️ *Restante:* ${formatBRL(booking.remainingValue)}\n\nQualquer dúvida é só chamar por aqui, tá bom? 🥰🎊`;
            };

            const generateBillingMessage = (booking) => {
                const client = clients.find(c => c.id === booking.clientId);
                const formattedDate = new Date(booking.eventDate + 'T00:00:00').toLocaleDateString('pt-BR');
                return `Olá, ${client?.fullName}! 😊\n\nPassando para lembrar que o seu evento está chegando (dia *${formattedDate}*). \n\nAtualmente temos um saldo restante em aberto no valor de *${formatBRL(booking.remainingValue)}* referente à locação do brinquedo.\n\nQualquer dúvida sobre o pagamento ou detalhes da entrega, pode nos mandar mensagem por aqui! 🎈`;
            };

            useEffect(() => {
                const currentVersion = "v6_frete_whatsapp_final";
                const storedVersion = localStorage.getItem('jukids_version_v6');
                
                if (storedVersion !== currentVersion) {
                    localStorage.setItem('jukids_toys_v6', JSON.stringify(toys));
                    localStorage.setItem('jukids_clients_v6', JSON.stringify(clients));
                    localStorage.setItem('jukids_bookings_v6', JSON.stringify(bookings));
                    localStorage.setItem('jukids_finances_v6', JSON.stringify(finances));
                    localStorage.setItem('jukids_logs_v6', JSON.stringify(bookingLogs));
                    localStorage.setItem('jukids_version_v6', currentVersion);
                }
            }, []);

            // Salva síncronamente e imediatamente quando os estados mudam
            const saveState = (key, value) => {
                localStorage.setItem(key, JSON.stringify(value));
            };

            // Double lock de segurança ao sair
            useEffect(() => {
                const handleBeforeUnload = () => {
                    localStorage.setItem('jukids_toys_v6', JSON.stringify(toys));
                    localStorage.setItem('jukids_clients_v6', JSON.stringify(clients));
                    localStorage.setItem('jukids_bookings_v6', JSON.stringify(bookings));
                    localStorage.setItem('jukids_finances_v6', JSON.stringify(finances));
                    localStorage.setItem('jukids_logs_v6', JSON.stringify(bookingLogs));
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [toys, clients, bookings, finances, bookingLogs]);

            // Gerenciador do Dark Mode
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            // Formatação de dinheiro
            const formatBRL = (value) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
            };

            // Cálculo auxiliar para conflitos
            const timeToMinutes = (timeStr) => {
                const [hrs, mins] = timeStr.split(':').map(Number);
                return hrs * 60 + mins;
            };

            // Log de alterações
            const addLogDirectly = (bookingId, desc, currentLogs) => {
                const log = {
                    id: Date.now() + Math.random(),
                    bookingId,
                    userId: userRole === 'admin' ? 1 : 2,
                    userName: userRole === 'admin' ? 'Administrador JuKids' : 'Funcionário',
                    changeDescription: desc,
                    changedAt: new Date().toLocaleString('pt-BR')
                };
                const updatedLogs = [log, ...currentLogs];
                setBookingLogs(updatedLogs);
                saveState('jukids_logs_v6', updatedLogs);
            };

            useEffect(() => {
                if (!newBooking.eventDate || newBooking.selectedToys.length === 0) {
                    setBookingConflict(null);
                    setAiSuggestions([]);
                    return;
                }

                const checkCollision = () => {
                    const newStart = timeToMinutes(newBooking.deliveryTime);
                    const newEnd = timeToMinutes(newBooking.withdrawalTime);

                    for (const toyId of newBooking.selectedToys) {
                        const targetToy = toys.find(t => t.id === Number(toyId));
                        
                        // Validar se o próprio brinquedo está em manutenção
                        if (targetToy && targetToy.status === 'MAINTENANCE') {
                            setBookingConflict(`O brinquedo "${targetToy.name}" está atualmente em Manutenção.`);
                            generateAiSuggestions(toyId);
                            return;
                        }

                        // Validar colisões de horário
                        const activeBookings = bookings.filter(b => 
                            b.eventDate === newBooking.eventDate && 
                            b.status !== 'CANCELLED' &&
                            b.id !== editingBookingId &&
                            b.toyIds.includes(Number(toyId))
                        );

                        for (const eb of activeBookings) {
                            const ebStart = timeToMinutes(eb.deliveryTime);
                            const ebEnd = timeToMinutes(eb.withdrawalTime);

                            if ((newStart < ebEnd) && (newEnd > ebStart)) {
                                const clientName = clients.find(c => c.id === Number(eb.clientId))?.fullName || "Outro Cliente";
                                setBookingConflict(`O brinquedo "${targetToy?.name}" já está reservado por ${clientName} nesta data das ${eb.deliveryTime} às ${eb.withdrawalTime}.`);
                                generateAiSuggestions(toyId);
                                return;
                            }
                        }
                    }
                    setBookingConflict(null);
                    setAiSuggestions([]);
                };

                const generateAiSuggestions = (busyToyId) => {
                    const busyToy = toys.find(t => t.id === Number(busyToyId));
                    if (!busyToy) return;

                    const alternativeToys = toys.filter(t => 
                        t.id !== busyToy.id && 
                        t.status === 'AVAILABLE' &&
                        Math.abs(t.rentalValue - busyToy.rentalValue) <= 60
                    );

                    const freeAlternatives = alternativeToys.filter(t => {
                        const newStart = timeToMinutes(newBooking.deliveryTime);
                        const newEnd = timeToMinutes(newBooking.withdrawalTime);
                        const activeBookings = bookings.filter(b => 
                            b.eventDate === newBooking.eventDate && 
                            b.status !== 'CANCELLED' &&
                            b.id !== editingBookingId &&
                            b.toyIds.includes(t.id)
                        );
                        
                        return !activeBookings.some(eb => {
                            const ebStart = timeToMinutes(eb.deliveryTime);
                            const ebEnd = timeToMinutes(eb.withdrawalTime);
                            return (newStart < ebEnd) && (newEnd > ebStart);
                        });
                    });

                    setAiSuggestions(freeAlternatives);
                };

                checkCollision();
            }, [newBooking, toys, bookings, editingBookingId]);

            const bookingCalculatedValues = useMemo(() => {
                const toysSum = newBooking.selectedToys.reduce((acc, id) => {
                    const toy = toys.find(t => t.id === Number(id));
                    return acc + (toy ? Number(toy.rentalValue) : 0);
                }, 0);

                const shipping = Number(newBooking.shippingValue || 0);
                const total = toysSum + shipping;
                const deposit = Number(newBooking.depositValue || 0);
                const remaining = total - deposit;
                const percentPaid = total > 0 ? Math.min(100, Math.round((deposit / total) * 100)) : 0;

                return { toysSum, shipping, total, deposit, remaining, percentPaid };
            }, [newBooking.selectedToys, newBooking.depositValue, newBooking.shippingValue, toys]);

            const filteredBookings = useMemo(() => {
                return bookings.filter(b => {
                    const bDate = new Date(b.eventDate + 'T00:00:00');
                    
                    if (searchQuery) {
                        const q = searchQuery.toLowerCase();
                        const client = clients.find(c => c.id === b.clientId);
                        const clientMatch = client?.fullName.toLowerCase().includes(q) || client?.phone.includes(q);
                        const dateMatch = b.eventDate.includes(q);
                        const toyMatch = b.toyIds.some(id => toys.find(t => t.id === id)?.name.toLowerCase().includes(q));
                        if (!clientMatch && !dateMatch && !toyMatch) return false;
                    }

                    if (timeFilter === 'all') return true;
                    if (timeFilter === 'day') return b.eventDate === getRelativeDate(0);
                    if (timeFilter === 'week') {
                        const todayNormalized = new Date(getRelativeDate(0) + 'T00:00:00');
                        const diffTime = Math.abs(todayNormalized - bDate);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays <= 7;
                    }
                    if (timeFilter === 'month') {
                        const currentToday = new Date();
                        return bDate.getMonth() === currentToday.getMonth() && bDate.getFullYear() === currentToday.getFullYear();
                    }
                    if (timeFilter === 'year') {
                        const currentToday = new Date();
                        return bDate.getFullYear() === currentToday.getFullYear();
                    }
                    return true;
                });
            }, [bookings, timeFilter, searchQuery, clients, toys]);

            const filteredFinances = useMemo(() => {
                return finances.filter(f => {
                    const fDate = new Date(f.receivedDate + 'T00:00:00');
                    if (timeFilter === 'all') return true;
                    if (timeFilter === 'day') return f.receivedDate === getRelativeDate(0);
                    if (timeFilter === 'week') {
                        const todayNormalized = new Date(getRelativeDate(0) + 'T00:00:00');
                        const diffTime = Math.abs(todayNormalized - fDate);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays <= 7;
                    }
                    if (timeFilter === 'month') {
                        const currentToday = new Date();
                        return fDate.getMonth() === currentToday.getMonth() && fDate.getFullYear() === currentToday.getFullYear();
                    }
                    if (timeFilter === 'year') {
                        const currentToday = new Date();
                        return fDate.getFullYear() === currentToday.getFullYear();
                    }
                    return true;
                });
            }, [finances, timeFilter]);

            const metrics = useMemo(() => {
                const totalIncome = filteredFinances.reduce((acc, f) => acc + Number(f.amountReceived), 0);
                const totalPending = filteredBookings.reduce((acc, b) => b.status !== 'CANCELLED' ? acc + Number(b.remainingValue) : acc, 0);
                const eventsCount = filteredBookings.filter(b => b.status !== 'CANCELLED').length;
                
                const todayStr = getRelativeDate(0);
                const tomorrowStr = getRelativeDate(1);
                const todayEvents = bookings.filter(b => b.eventDate === todayStr && b.status !== 'CANCELLED').length;
                const tomorrowEvents = bookings.filter(b => b.eventDate === tomorrowStr && b.status !== 'CANCELLED').length;

                return {
                    totalIncome,
                    totalPending,
                    eventsCount,
                    todayEvents,
                    tomorrowEvents,
                    profit: totalIncome * 1.00
                };
            }, [filteredBookings, filteredFinances, bookings]);

            const handleAddClient = (e) => {
                e.preventDefault();
                if (!newClient.fullName || !newClient.phone) return;
                const client = {
                    id: Date.now(),
                    fullName: newClient.fullName,
                    phone: newClient.phone,
                    notes: newClient.notes
                };
                
                const updated = [...clients, client];
                setClients(updated);
                saveState('jukids_clients_v6', updated);

                setNewClient({ fullName: '', phone: '', notes: '' });
                setShowClientModal(false);
                triggerToast("Cliente cadastrado com sucesso!");
            };

            const handleAddToy = (e) => {
                e.preventDefault();
                if (!newToy.name || !newToy.rentalValue) return;
                const toy = {
                    id: Date.now(),
                    name: newToy.name,
                    rentalValue: parseFloat(newToy.rentalValue),
                    status: newToy.status
                };

                const updated = [...toys, toy];
                setToys(updated);
                saveState('jukids_toys_v6', updated);

                setNewToy({ name: '', rentalValue: '', status: 'AVAILABLE' });
                setShowToyModal(false);
                triggerToast("Novo brinquedo adicionado com sucesso!");
            };

            const handleAddBooking = (e) => {
                e.preventDefault();
                if (bookingConflict) return;
                if (!newBooking.clientName.trim() || newBooking.selectedToys.length === 0) return;

                let targetClientId;
                const existingClient = clients.find(
                    c => c.fullName.toLowerCase().trim() === newBooking.clientName.toLowerCase().trim()
                );

                if (existingClient) {
                    targetClientId = existingClient.id;
                } else {
                    const newClientId = Date.now();
                    const createdClient = {
                        id: newClientId,
                        fullName: newBooking.clientName.trim(),
                        phone: newBooking.clientPhone || 'Não Informado',
                        notes: 'Cadastrado automaticamente via nova reserva.'
                    };
                    
                    const updatedClients = [...clients, createdClient];
                    setClients(updatedClients);
                    saveState('jukids_clients_v6', updatedClients);
                    targetClientId = newClientId;
                }

                const bookingId = Date.now() + 1;
                const booking = {
                    id: bookingId,
                    clientId: targetClientId,
                    eventDate: newBooking.eventDate,
                    deliveryTime: newBooking.deliveryTime,
                    withdrawalTime: newBooking.withdrawalTime,
                    toyIds: newBooking.selectedToys.map(Number),
                    shippingValue: bookingCalculatedValues.shipping, 
                    totalValue: bookingCalculatedValues.total,       
                    depositValue: bookingCalculatedValues.deposit,
                    remainingValue: bookingCalculatedValues.remaining,
                    depositPaymentDate: bookingCalculatedValues.deposit > 0 ? getRelativeDate(0) : null,
                    status: bookingCalculatedValues.remaining === 0 ? 'PAID' : (bookingCalculatedValues.deposit > 0 ? 'DEPOSIT_PAID' : 'WAITING_DEPOSIT'),
                    notes: newBooking.notes
                };

                const updatedFinances = [...finances];
                if (bookingCalculatedValues.deposit > 0) {
                    const entry = {
                        id: Date.now() + 2,
                        clientId: targetClientId,
                        bookingId: bookingId,
                        receivedDate: getRelativeDate(0),
                        amountReceived: bookingCalculatedValues.deposit
                    };
                    updatedFinances.push(entry);
                    setFinances(updatedFinances);
                    saveState('jukids_finances_v6', updatedFinances);
                }

                const updatedBookings = [...bookings, booking];
                setBookings(updatedBookings);
                saveState('jukids_bookings_v6', updatedBookings);

                addLogDirectly(bookingId, `Reserva criada para ${newBooking.clientName.trim()}. Total: ${formatBRL(booking.totalValue)} (Frete: ${formatBRL(booking.shippingValue)}), Sinal: ${formatBRL(booking.depositValue)}`, bookingLogs);
                
                setNewBooking({
                    clientName: '',
                    clientPhone: '',
                    eventDate: getRelativeDate(0),
                    deliveryTime: '08:00',
                    withdrawalTime: '18:00',
                    selectedToys: [],
                    shippingValue: '',
                    depositValue: '',
                    notes: ''
                });
                setShowBookingModal(false);
                triggerToast("Reserva salva com sucesso!");
            };

            const handleUpdateBooking = (e) => {
                e.preventDefault();
                if (bookingConflict) return;
                if (!newBooking.clientName.trim() || newBooking.selectedToys.length === 0) return;

                const existingBooking = bookings.find(b => b.id === editingBookingId);
                if (!existingBooking) return;

                // Atualiza nome/telefone do cliente já vinculado, sem criar um cliente duplicado
                const updatedClients = clients.map(c =>
                    c.id === existingBooking.clientId
                        ? { ...c, fullName: newBooking.clientName.trim(), phone: newBooking.clientPhone || c.phone }
                        : c
                );
                setClients(updatedClients);
                saveState('jukids_clients_v6', updatedClients);

                const updatedBooking = {
                    ...existingBooking,
                    eventDate: newBooking.eventDate,
                    deliveryTime: newBooking.deliveryTime,
                    withdrawalTime: newBooking.withdrawalTime,
                    toyIds: newBooking.selectedToys.map(Number),
                    shippingValue: bookingCalculatedValues.shipping,
                    totalValue: bookingCalculatedValues.total,
                    depositValue: bookingCalculatedValues.deposit,
                    remainingValue: bookingCalculatedValues.remaining,
                    status: existingBooking.status === 'CANCELLED'
                        ? 'CANCELLED'
                        : (bookingCalculatedValues.remaining === 0 ? 'PAID' : (bookingCalculatedValues.deposit > 0 ? 'DEPOSIT_PAID' : 'WAITING_DEPOSIT')),
                    notes: newBooking.notes
                };

                const updatedBookings = bookings.map(b => b.id === editingBookingId ? updatedBooking : b);
                setBookings(updatedBookings);
                saveState('jukids_bookings_v6', updatedBookings);

                addLogDirectly(
                    editingBookingId,
                    `Reserva editada. Nova data: ${new Date(updatedBooking.eventDate + 'T00:00:00').toLocaleDateString('pt-BR')}, ${updatedBooking.deliveryTime} às ${updatedBooking.withdrawalTime}.`,
                    bookingLogs
                );

                setEditingBookingId(null);
                setNewBooking({
                    clientName: '',
                    clientPhone: '',
                    eventDate: getRelativeDate(0),
                    deliveryTime: '08:00',
                    withdrawalTime: '18:00',
                    selectedToys: [],
                    shippingValue: '',
                    depositValue: '',
                    notes: ''
                });
                setShowBookingModal(false);
                triggerToast("Reserva atualizada com sucesso!");
            };

            const handleAddPayment = (e) => {
                e.preventDefault();
                const bId = Number(newPayment.bookingId);
                const booking = bookings.find(b => b.id === bId);
                if (!booking) return;

                const amount = parseFloat(newPayment.amountReceived);
                if (isNaN(amount) || amount <= 0) return;

                const updatedBookings = bookings.map(b => {
                    if (b.id === bId) {
                        const newRemaining = Math.max(0, Number(b.remainingValue) - amount);
                        const newDeposit = Number(b.depositValue) + amount;
                        const isFullyPaid = newRemaining === 0;
                        return {
                            ...b,
                            depositValue: newDeposit,
                            remainingValue: newRemaining,
                            status: isFullyPaid ? 'PAID' : 'DEPOSIT_PAID'
                        };
                    }
                    return b;
                });

                const entry = {
                    id: Date.now(),
                    clientId: booking.clientId,
                    bookingId: bId,
                    receivedDate: newPayment.receivedDate,
                    amountReceived: amount
                };

                const updatedFinances = [...finances, entry];
                setFinances(updatedFinances);
                saveState('jukids_finances_v6', updatedFinances);

                setBookings(updatedBookings);
                saveState('jukids_bookings_v6', updatedBookings);

                addLogDirectly(bId, `Pagamento recebido: ${formatBRL(amount)}. Novo saldo pendente: ${formatBRL(Math.max(0, Number(booking.remainingValue) - amount))}`, bookingLogs);
                setShowPaymentModal(false);
                setNewPayment({ clientId: '', bookingId: '', amountReceived: '', receivedDate: getRelativeDate(0) });
                triggerToast("Pagamento registrado com sucesso!");
            };

            const handleToggleToyStatus = (toyId) => {
                if (userRole !== 'admin') {
                    triggerToast("Apenas Administradores podem alterar a manutenção de brinquedos.", "error");
                    return;
                }
                const updated = toys.map(t => {
                    if (t.id === toyId) {
                        const nextStatus = t.status === 'MAINTENANCE' ? 'AVAILABLE' : 'MAINTENANCE';
                        return { ...t, status: nextStatus };
                    }
                    return t;
                });
                setToys(updated);
                saveState('jukids_toys_v6', updated);
                triggerToast("Status do brinquedo atualizado com sucesso!");
            };

            const handleCancelBooking = (bookingId) => {
                triggerConfirm(
                    "Cancelar Reserva",
                    "Tem certeza que deseja CANCELAR esta reserva de brinquedo?",
                    () => {
                        const updated = bookings.map(b => b.id === bookingId ? { ...b, status: 'CANCELLED' } : b);
                        setBookings(updated);
                        saveState('jukids_bookings_v6', updated);
                        addLogDirectly(bookingId, "Reserva cancelada pelo usuário.", bookingLogs);
                        triggerToast("Reserva cancelada com sucesso!");
                    }
                );
            };

            const rankingClients = useMemo(() => {
                const map = {};
                bookings.filter(b => b.status !== 'CANCELLED').forEach(b => {
                    map[b.clientId] = (map[b.clientId] || 0) + 1;
                });
                return Object.entries(map).map(([id, count]) => {
                    const client = clients.find(c => c.id === Number(id));
                    return {
                        name: client ? client.fullName : 'Desconhecido',
                        phone: client ? client.phone : '',
                        count
                    };
                }).sort((a, b) => b.count - a.count).slice(0, 5);
            }, [bookings, clients]);

            const rankingToys = useMemo(() => {
                const map = {};
                bookings.filter(b => b.status !== 'CANCELLED').forEach(b => {
                    b.toyIds.forEach(id => {
                        map[id] = (map[id] || 0) + 1;
                    });
                });
                return Object.entries(map).map(([id, count]) => {
                    const toy = toys.find(t => t.id === Number(id));
                    return {
                        name: toy ? toy.name : 'Brinquedo Antigo',
                        count
                    };
                }).sort((a, b) => b.count - a.count).slice(0, 5);
            }, [bookings, toys]);

            const handleExportCSV = (type) => {
                let csvContent = "data:text/csv;charset=utf-8,";
                if (type === 'reservas') {
                    csvContent += "ID;Cliente;Data;Entrega;Retirada;Valor Frete;Valor Total;Valor Pago;Restante;Status\n";
                    bookings.forEach(b => {
                        const clientName = clients.find(c => c.id === b.clientId)?.fullName || '';
                        csvContent += `${b.id};${clientName};${b.eventDate};${b.deliveryTime};${b.withdrawalTime};${b.shippingValue || 0};${b.totalValue};${b.depositValue};${b.remainingValue};${b.status}\n`;
                    });
                } else if (type === 'financeiro') {
                    csvContent += "ID;Cliente;Data Recebimento;Valor Recebido\n";
                    finances.forEach(f => {
                        const clientName = clients.find(c => c.id === f.clientId)?.fullName || '';
                        csvContent += `${f.id};${clientName};${f.receivedDate};${f.amountReceived}\n`;
                    });
                }
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `jukids_export_${type}_${getRelativeDate(0)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerToast("Relatório CSV baixado com sucesso!");
            };

            const handleExportBackup = () => {
                const backupData = {
                    toys,
                    clients,
                    bookings,
                    finances,
                    logs: bookingLogs
                };
                const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(backupData))}`;
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", jsonString);
                downloadAnchor.setAttribute("download", `jukids_backup_${getRelativeDate(0)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
                triggerToast("Backup gerado e baixado!");
            };

            const handleRestoreBackup = (e) => {
                const fileReader = new FileReader();
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.toys && parsed.clients && parsed.bookings && parsed.finances) {
                            setToys(parsed.toys);
                            setClients(parsed.clients);
                            setBookings(parsed.bookings);
                            setFinances(parsed.finances);
                            if (parsed.logs) setBookingLogs(parsed.logs);
                            
                            saveState('jukids_toys_v6', parsed.toys);
                            saveState('jukids_clients_v6', parsed.clients);
                            saveState('jukids_bookings_v6', parsed.bookings);
                            saveState('jukids_finances_v6', parsed.finances);
                            if (parsed.logs) saveState('jukids_logs_v6', parsed.logs);

                            triggerToast("Backup restaurado e salvo com sucesso!");
                        } else {
                            triggerToast("Arquivo de backup inválido.", "error");
                        }
                    } catch (err) {
                        triggerToast("Erro ao ler o arquivo de backup.", "error");
                    }
                };
            };

            const CalendarView = () => {
                const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
                const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());

                const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();

                const handlePrevMonth = () => {
                    if (currentMonth === 0) {
                        setCurrentMonth(11);
                        setCurrentYear(prev => prev - 1);
                    } else {
                        setCurrentMonth(prev => prev - 1);
                    }
                };

                const handleNextMonth = () => {
                    if (currentMonth === 11) {
                        setCurrentMonth(0);
                        setCurrentYear(prev => prev + 1);
                    } else {
                        setCurrentMonth(prev => prev + 1);
                    }
                };

                const daysArray = [];
                for (let i = 1; i <= daysInMonth; i++) {
                    daysArray.push(i);
                }

                return (
                    <div className="bg-white dark:bg-brand-darkCard p-6 rounded-3xl shadow-xl border border-pink-100 dark:border-slate-800">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="brand-title text-xl font-bold text-brand-pink-600 dark:text-brand-pink-300">{monthNames[currentMonth]} {currentYear}</h3>
                            <div className="flex gap-2">
                                <button onClick={handlePrevMonth} className="p-2 hover:bg-brand-pink-50 dark:hover:bg-slate-700 rounded-lg text-brand-pink-500"><i className="fa-solid fa-chevron-left"></i></button>
                                <button onClick={handleNextMonth} className="p-2 hover:bg-brand-pink-50 dark:hover:bg-slate-700 rounded-lg text-brand-pink-500"><i className="fa-solid fa-chevron-right"></i></button>
                            </div>
                        </div>

                        <div className="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-500 mb-2">
                            <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SAB</div>
                        </div>

                        <div className="grid grid-cols-7 gap-2">
                            {Array.from({ length: firstDayIndex }).map((_, idx) => (
                                <div key={`empty-${idx}`} className="h-12"></div>
                            ))}

                            {daysArray.map(day => {
                                const formattedDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const hasReservations = bookings.some(b => b.eventDate === formattedDate && b.status !== 'CANCELLED');
                                const dayBookings = bookings.filter(b => b.eventDate === formattedDate && b.status !== 'CANCELLED');

                                return (
                                    <button
                                        key={day}
                                        onClick={() => setSelectedDate({ date: formattedDate, bookings: dayBookings })}
                                        className={`h-12 relative flex items-center justify-center rounded-xl text-sm font-semibold transition-all ${
                                            hasReservations 
                                                ? 'bg-brand-pink-100 text-brand-pink-700 dark:bg-brand-pink-700 dark:text-white border-2 border-brand-pink-300' 
                                                : 'hover:bg-slate-100 dark:hover:bg-slate-800'
                                        }`}
                                    >
                                        <span>{day}</span>
                                        {hasReservations && (
                                            <span className="absolute bottom-1 w-2 h-2 bg-brand-pink-500 rounded-full"></span>
                                        )}
                                    </button>
                                );
                            })}
                        </div>

                        {selectedDate && (
                            <div className="mt-8 p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl border border-pink-100 dark:border-slate-700 animate-fadeIn">
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="font-bold text-sm text-brand-pink-600">Reservas para {new Date(selectedDate.date + 'T00:00:00').toLocaleDateString('pt-BR')}</h4>
                                    <button onClick={() => setSelectedDate(null)} className="text-xs text-slate-500 hover:underline">Fechar</button>
                                </div>
                                {selectedDate.bookings.length === 0 ? (
                                    <p className="text-xs text-slate-500">Nenhum brinquedo reservado neste dia.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {selectedDate.bookings.map(b => {
                                            const client = clients.find(c => c.id === b.clientId);
                                            return (
                                                <div key={b.id} className="p-3 bg-white dark:bg-brand-darkCard rounded-xl shadow-sm border border-pink-50 dark:border-slate-800 flex justify-between items-center">
                                                    <div>
                                                        <p className="font-bold text-sm text-brand-blue-700 dark:text-brand-blue-300">{client?.fullName}</p>
                                                        <p className="text-xs text-slate-500">{b.deliveryTime} às {b.withdrawalTime}</p>
                                                        <p className="text-xs text-slate-400">Frete: {formatBRL(b.shippingValue || 0)}</p>
                                                        <p className="text-xs text-brand-pink-600 font-semibold mt-1">
                                                            {b.toyIds.map(id => toys.find(t => t.id === id)?.name).join(', ')}
                                                        </p>
                                                    </div>
                                                    <span className="px-2 py-1 rounded-full text-xs font-semibold bg-brand-pink-50 text-brand-pink-700">{b.status}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row h-screen overflow-hidden">
                    
                    {/* TOAST NOTIFICATION CONTAINER */}
                    {notification && (
                        <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-5 py-3 rounded-2xl shadow-2xl transition-all border transform translate-y-0 scale-100 animate-bounce ${
                            notification.type === 'error' 
                                ? 'bg-red-50 border-red-200 text-red-800' 
                                : 'bg-brand-blue-50 border-brand-blue-200 text-brand-blue-800 dark:bg-brand-darkCard dark:text-brand-blue-300 dark:border-brand-blue-900'
                        }`}>
                            <i className={`fa-solid ${notification.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                            <span className="text-sm font-semibold">{notification.message}</span>
                        </div>
                    )}

                    {/* CONFIRMATION OVERLAY MODAL */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                            <div className="bg-white dark:bg-brand-darkCard p-6 rounded-3xl max-w-sm w-full shadow-2xl text-center space-y-4">
                                <h3 className="brand-title text-lg font-bold text-brand-pink-500">{confirmDialog.title}</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300">{confirmDialog.message}</p>
                                <div className="flex gap-3 justify-center">
                                    <button 
                                        onClick={() => setConfirmDialog(null)}
                                        className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-500 rounded-xl text-xs font-semibold"
                                    >
                                        Não, voltar
                                    </button>
                                    <button 
                                        onClick={() => {
                                            confirmDialog.onConfirm();
                                            setConfirmDialog(null);
                                        }}
                                        className="px-4 py-2 bg-brand-pink-500 hover:bg-brand-pink-600 text-white rounded-xl text-xs font-semibold"
                                    >
                                        Sim, confirmar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- BARRA LATERAL (MENU) --- */}
                    <aside className="w-full md:w-64 bg-white dark:bg-brand-darkCard border-r border-pink-100 dark:border-slate-800 flex flex-col justify-between p-6 z-10">
                        <div>
                            {/* Logo */}
                            <div className="flex items-center gap-3 mb-10">
                                <div className="w-10 h-10 bg-gradient-to-tr from-brand-blue-300 to-brand-pink-300 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg shadow-pink-100 dark:shadow-none">
                                    <i className="fa-solid fa-cubes"></i>
                                </div>
                                <span className="brand-title text-2xl font-black bg-gradient-to-r from-brand-blue-500 to-brand-pink-500 bg-clip-text text-transparent">JuKids</span>
                            </div>

                            {/* Navegação */}
                            <nav className="space-y-2">
                                <button 
                                    onClick={() => setCurrentTab('dashboard')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'dashboard' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-chart-line text-brand-blue-500"></i> Dashboard
                                </button>
                                <button 
                                    onClick={() => setCurrentTab('bookings')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'bookings' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-calendar-check text-brand-pink-500"></i> Reservas
                                </button>
                                <button 
                                    onClick={() => setCurrentTab('clients')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'clients' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-users text-brand-blue-500"></i> Clientes
                                </button>
                                <button 
                                    onClick={() => setCurrentTab('toys')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'toys' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-shapes text-brand-pink-500"></i> Brinquedos
                                </button>
                                <button 
                                    onClick={() => setCurrentTab('calendar')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'calendar' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-calendar-days text-brand-blue-500"></i> Agenda Mensal
                                </button>
                                <button 
                                    onClick={() => setCurrentTab('finance')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'finance' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-receipt text-brand-pink-500"></i> Financeiro
                                </button>
                                <button 
                                    onClick={() => setCurrentTab('reports')} 
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                                        currentTab === 'reports' ? 'bg-gradient-to-r from-brand-blue-100 to-brand-pink-100 text-brand-blue-700 dark:from-slate-800 dark:to-slate-700 dark:text-white shadow-sm' : 'hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                                    }`}
                                >
                                    <i className="fa-solid fa-file-invoice-dollar text-brand-blue-500"></i> Relatórios
                                </button>
                            </nav>
